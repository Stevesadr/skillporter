name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate capability profiles
        run: npm run validate:profiles

      - name: Build
        run: npm run build

      - name: Check the lint rule catalogue is current
        run: npm run rules:check

      - name: Test
        run: npm run test:only

      - name: Smoke test the CLI
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/index.js agents > /dev/null
          node packages/cli/dist/index.js inspect fixtures/skills/simple-prompt --from claude-code > /dev/null
          node packages/cli/dist/index.js inspect fixtures/skills/report-builder --from claude-code --json > /dev/null

          # `lint` exits 2 when it reports warnings only. That is a documented
          # result, not a failure, so the code is checked explicitly instead of
          # relying on errexit. A crash would also exit non-zero, so the rendered
          # report is checked for content as well.
          out="$(mktemp -d)"
          set +e
          node packages/cli/dist/index.js lint fixtures/skills/simple-prompt --for opencode > "$out/lint.txt" 2> "$out/lint.err"
          text_code=$?
          node packages/cli/dist/index.js lint fixtures/skills/report-builder --for claude-code --format json > "$out/lint.json" 2> "$out/lint-json.err"
          json_code=$?
          set -e

          echo "lint text: exit $text_code; lint json: exit $json_code"
          for code in "$text_code" "$json_code"; do
            case "$code" in
              0|1|2) ;;
              *) echo "lint exited $code, which is not one of the documented codes 0, 1 or 2" >&2; exit 1 ;;
            esac
          done
          grep -q 'result' "$out/lint.txt"
          node -e "const r = JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')); if (!Array.isArray(r.findings)) throw new Error('lint JSON has no findings array');" "$out/lint.json"
          rm -rf "$out"

      - name: Check the documented exit codes
        shell: bash
        run: |
          set +e
          node packages/cli/dist/index.js lint fixtures/lint/.agents/skills/flat-skill.md --for deepseek-harness --from deepseek-harness > /dev/null
          clean=$?
          node packages/cli/dist/index.js lint fixtures/lint/.agents/skills/flat-skill.md --for codex-cli --from deepseek-harness > /dev/null
          failed=$?
          node packages/cli/dist/index.js lint fixtures/lint/.agents/skills/long-description --for deepseek-harness --from deepseek-harness > /dev/null
          warned=$?
          set -e
          echo "clean=$clean error=$failed warnings=$warned"
          [ "$clean" = "0" ] && [ "$failed" = "1" ] && [ "$warned" = "2" ]

      - name: Check that nothing executes skill content
        shell: bash
        run: |
          # The security suite asserts this, but a direct check makes the guarantee
          # visible in the job log and fails loudly if the fixture ever changes.
          if [ -n "$(find . -name 'PWNED-BY-SKILLPORTER*' -not -path './node_modules/*' 2>/dev/null)" ]; then
            echo "a marker file exists: skill content was executed" >&2
            exit 1
          fi
          echo "no execution markers present"
